# Isolated dots.mocr OCR engine on llama.cpp (OpenSpec change
# dots-mocr-llamacpp-backend, design D1). This project holds no PyTorch,
# torchvision, transformers or accelerate: the model runs in a pinned
# llama.cpp server that the worker starts itself. Nothing here may enter
# OMRS's main environment, root lockfile, or import graph. Provision with
# `python3 ocr-workers/provision.py dots-mocr-llamacpp --accept-model-licence`,
# never with a bare `uv sync` from the repository root.
[project]
name = "omrs-ocr-dots-mocr-llamacpp"
version = "0.1.0"
description = "Isolated dots.mocr document-parsing engine for OMRS on a pinned llama.cpp server"
requires-python = ">=3.11,<3.14"
dependencies = [
    "omrs-ocr-worker-core",
    # Finds the Hugging Face token and downloads the private model files.
    "huggingface-hub",
    # Page rendering.
    "pypdfium2",
    "pillow",
]

[project.scripts]
# Downloads the model, the projector and the llama.cpp release, and checks their hashes.
omrs-ocr-fetch = "omrs_ocr_dots_mocr_llamacpp.fetch:main"

[project.entry-points."omrs.ocr_engine"]
dots-mocr-llamacpp = "omrs_ocr_dots_mocr_llamacpp.engine:ENGINE"

[tool.uv.sources]
omrs-ocr-worker-core = { path = "../../core" }

[tool.omrs-ocr]
# The model licence adds terms beyond MIT. provision.py refuses this
# engine without --accept-model-licence and prints this file's path.
licence-file = "LICENCE-NOTES.md"
requires-acceptance = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omrs_ocr_dots_mocr_llamacpp"]
