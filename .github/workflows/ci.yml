name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main, v3, v4, integration/core-web]
  pull_request:
    branches: [main, v3, v4, integration/core-web, harden-pipeline-correctness-before-calibration]

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      # Pinned to SHA for security — actions/checkout@v7.0.0
      # fetch-depth 0: the exp-29 pinned-baseline tests read historical
      # commits via `git show <rev>:<path>`; a shallow checkout lacks them.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        # Pinned to SHA for security — actions/setup-python@v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        # Pinned to SHA for security — astral-sh/setup-uv@v8.2.0
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      # The web extra (FastAPI) lets the web transport and OpenAPI
      # runtime conformance tests run here. The clean-base tripwire counts
      # assume it; jobs without it adjust through the tripwire's
      # fastapi-absent branch.
      - name: Install dependencies
        env:
          UV_LINK_MODE: copy
        run: uv sync --frozen --extra web

      # Parallel with pytest-xdist; `--dist loadfile` comes from pyproject.toml.
      # The run writes a JUnit report. The tripwire runs as its own step below
      # and reads its executed count from that report through
      # OMRS_TRIPWIRE_JUNIT, so it does not run the suite again.
      - name: Run tests (fast)
        env:
          PDF_READER: pypdf
          EMBED_PROVIDER: local
          LOCAL_BACKEND: ollama
          EMBED_MODEL: nomic-embed-text
          OLLAMA_BASE_URL: http://localhost:11434
          METADATA_LLM_PROVIDER: local
        run: uv run --no-sync pytest -m "not slow" --tb=short -q -n auto --maxprocesses=8 --deselect tests/test_clean_base_tripwire.py --junitxml=${{ runner.temp }}/fast-junit.xml

      - name: Run clean-base tripwire
        env:
          PDF_READER: pypdf
          EMBED_PROVIDER: local
          LOCAL_BACKEND: ollama
          EMBED_MODEL: nomic-embed-text
          OLLAMA_BASE_URL: http://localhost:11434
          METADATA_LLM_PROVIDER: local
          OMRS_TRIPWIRE_JUNIT: ${{ runner.temp }}/fast-junit.xml
        run: uv run --no-sync pytest tests/test_clean_base_tripwire.py --tb=short -q

      # Verify the default install stays torch-free (ADR-038).
      - name: Verify default install is torch-free
        run: |
          set -euo pipefail
          if ! packages="$(uv pip list)"; then
            echo "FAIL: unable to inspect default install" >&2
            exit 1
          fi
          if printf '%s\n' "$packages" | grep -qiE '^(torch|transformers)([[:space:]]|$)'; then
            echo "FAIL: torch or transformers found in default install"
            exit 1
          fi
          echo "OK: default install is torch-free"

      # Phase 2 (config/compose/DI layering): import-linter contracts must
      # pass — settings models stay pure data, providers are constructed
      # only in compose.py, and core business modules avoid providers.
      - name: Run import-linter contracts
        run: uv run --no-sync lint-imports

      # Phase 5: validate the OpenAPI 3.1 contract on every push.
      - name: Validate OpenAPI contract
        run: uv run --no-sync python -c "import yaml; from openapi_spec_validator import validate; validate(yaml.safe_load(open('src/omrs/transports/api/openapi.yaml')))" && echo "OpenAPI contract valid"

      - name: Run tests (slow, liteparse on macOS)
        if: matrix.os == 'macos-latest'
        env:
          PDF_READER: liteparse
        # Gate strictly when an Ollama server is reachable; skip visibly
        # otherwise. The old `|| echo` swallowed genuine slow-suite
        # failures along with Ollama-unavailability.
        run: |
          if ! curl -s --max-time 5 http://localhost:11434/api/tags > /dev/null 2>&1; then
            echo "Slow tests skipped: no Ollama server at localhost:11434"
            exit 0
          fi
          uv run --no-sync pytest -m "slow" --tb=short -q

  # This small synthetic corpus guards dense score conversion, RRF,
  # threshold handling, and final ranking. Subtle embedding-model drift
  # still requires the broader experiments process.
  retrieval-quality-tier1:
    name: Retrieval quality (Tier 1)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    continue-on-error: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Install dependencies
        env:
          UV_LINK_MODE: copy
        run: uv sync --frozen

      - name: Confirm slow quality cases are excluded ordinarily
        run: |
          set -euo pipefail
          uv run --no-sync pytest tests/quality -m "not slow" --collect-only -q

      - name: Run quality metric unit tests
        run: |
          set -euo pipefail
          uv run --no-sync pytest tests/quality/test_metrics.py --tb=short -q

      - name: Run deterministic Tier 1 gate
        env:
          PDF_READER: pypdf
          EMBED_PROVIDER: local
          LOCAL_BACKEND: ollama
          EMBED_MODEL: nomic-embed-text
          OLLAMA_BASE_URL: http://localhost:11434
          METADATA_LLM_PROVIDER: local
        run: |
          set -euo pipefail
          uv run --no-sync pytest tests/quality/test_metrics.py tests/quality/test_retrieval_quality_tier1.py -m slow --tb=short -q -s

  # This runs the same narrow production path with the pinned real model.
  # It does not detect subtle model drift; use experiments for that work.
  retrieval-quality-tier2:
    name: Retrieval quality (Tier 2)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Install dependencies
        env:
          UV_LINK_MODE: copy
        run: uv sync --frozen

      - name: Install pinned Ollama
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/ollama/ollama/releases/download/v0.33.2/install.sh -o /tmp/install-ollama.sh
          echo "25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f  /tmp/install-ollama.sh" | sha256sum --check --strict
          OLLAMA_VERSION=0.33.2 sh /tmp/install-ollama.sh

      - name: Start Ollama and pull reference model
        run: |
          set -euo pipefail
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/version > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/ollama.log
              exit 1
            fi
            sleep 1
          done
          ollama pull qwen3-embedding:0.6b

      - name: Run real-Ollama Tier 2 gate
        run: |
          set -euo pipefail
          uv run --no-sync pytest tests/quality/test_retrieval_quality_tier2.py -m slow --tb=short -q -s

  # ── Floor-resolution CI job (ADR-042) ────────────────────────────────
  # Installs at the declared lower bounds (--resolution lowest-direct) and
  # runs the fast test suite. This converts the floors in pyproject.toml
  # from a comment into a tested contract. Without it they rot again on
  # the next upgrade cycle. See raise-dependency-floors OpenSpec change.
  #
  # Matrix covers the base install plus every non-torch extra that adds
  # packages beyond the base, because `uv sync` does not install optional
  # dependencies unless an extra is selected — without the matrix the floors
  # in [project.optional-dependencies] would never be exercised at their lower
  # bounds. An extra that adds nothing beyond the base (llamacpp, openrouter,
  # pdf-inspector) gets no entry. The torch extra
  # is excluded here because it has its own dedicated job below (ADR-038) and
  # must never enter the default install path.
  #
  # The floors-scope job decides the matrix (ADR-107). A pull request that
  # changes none of pyproject.toml, uv.lock and this file runs the base entry
  # only. Every other event runs the base entry and every extra.
  floors-scope:
    name: Floor matrix scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      extras: ${{ steps.scope.outputs.extras }}
    steps:
      # Pinned to SHA for security — actions/checkout@v7.0.0
      # fetch-depth 0: the three-dot diff needs the merge base of the
      # pull request's base and head commits.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Choose the floor entries
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The three-dot diff compares the head with the merge base, so commits
        # that land on the base branch after the fork do not count. Any git
        # error keeps the full list: a broken check runs more floors, not fewer.
        run: |
          full='["","hybrid","pdf-pypdfium2","community-leiden","azure","anthropic","chroma","web"]'
          extras="$full"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
              echo "::warning::the pull request SHAs are empty, so every floor entry runs"
            elif changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"; then
              # A here-string, not a pipe: under pipefail, grep -q can end a
              # long pipe early and make the test fail the wrong way.
              if ! grep -qxE 'pyproject\.toml|uv\.lock|\.github/workflows/ci\.yml' <<<"$changed"; then
                extras='[""]'
              fi
            else
              echo "::warning::git diff failed, so every floor entry runs"
            fi
          fi
          echo "Floor entries: $extras"
          echo "extras=$extras" >> "$GITHUB_OUTPUT"

  floors:
    needs: floors-scope
    name: Floor resolution${{ matrix.extra && format(' ({0})', matrix.extra) || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        extra: ${{ fromJSON(needs.floors-scope.outputs.extras) }}
    steps:
      # Pinned to SHA for security — actions/checkout@v7.0.0
      # fetch-depth 0: the exp-29 pinned-baseline tests read historical
      # commits via `git show <rev>:<path>`; a shallow checkout lacks them.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        # Pinned to SHA for security — actions/setup-python@v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        # Pinned to SHA for security — astral-sh/setup-uv@v8.2.0
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Install dependencies at declared floors
        # UV_LINK_MODE=copy avoids hardlinking package files from the uv
        # cache into .venv. nltk >=3.10.3 refuses to open multiply-linked
        # data files (CWE-59 hardening), and this job re-resolves
        # transitive deps (unlike the frozen `test` job), so it can pick
        # up the newer nltk release that trips that check. See TDR-008.
        env:
          UV_LINK_MODE: copy
        run: uv sync --resolution lowest-direct${{ matrix.extra && format(' --extra {0}', matrix.extra) || '' }}

      - name: Run tests (fast) at floors
        env:
          PDF_READER: pypdf
          EMBED_PROVIDER: local
          LOCAL_BACKEND: ollama
          EMBED_MODEL: nomic-embed-text
          OLLAMA_BASE_URL: http://localhost:11434
          METADATA_LLM_PROVIDER: local
        # The exact skip/count manifest is a clean-base assertion. Optional
        # extras intentionally activate additional tests, so those matrix
        # entries exercise the suite without the base-only tripwire module.
        # The base entry deselects the tripwire here. Every entry writes a
        # JUnit report. The base entry's tripwire then runs as its own step and
        # reads its executed count from that report, so it does not run the
        # suite again. The chroma entry's skip check reads the same report.
        run: uv run --no-sync pytest -m "not slow" --tb=short -q -n auto --maxprocesses=8 ${{ matrix.extra && '--ignore=tests/test_clean_base_tripwire.py' || '--deselect tests/test_clean_base_tripwire.py' }} --junitxml=${{ runner.temp }}/fast-junit.xml

      # The report keeps every skip reason under xdist, including module-level
      # importorskip skips, so the check reads it and not the console output.
      - name: Assert no test skipped for a missing chroma extra
        if: ${{ !cancelled() && matrix.extra == 'chroma' }}
        run: |
          report="${{ runner.temp }}/fast-junit.xml"
          if [ ! -f "$report" ]; then
            echo "::error::$report is missing, so the chroma skip check cannot run"
            exit 1
          fi
          if grep -q 'chroma extra not installed' "$report"; then
            echo "::error::Tests skipped with the chroma-extra reason even though the extra is installed"
            grep -o 'message="[^"]*chroma extra not installed[^"]*"' "$report" | sort | uniq -c
            exit 1
          fi

      - name: Run clean-base tripwire at floors
        if: matrix.extra == ''
        env:
          PDF_READER: pypdf
          EMBED_PROVIDER: local
          LOCAL_BACKEND: ollama
          EMBED_MODEL: nomic-embed-text
          OLLAMA_BASE_URL: http://localhost:11434
          METADATA_LLM_PROVIDER: local
          OMRS_TRIPWIRE_JUNIT: ${{ runner.temp }}/fast-junit.xml
        run: uv run --no-sync pytest tests/test_clean_base_tripwire.py --tb=short -q

      - name: Verify base install stays Leiden-free
        if: matrix.extra == ''
        run: |
          set -euo pipefail
          packages="$(uv pip list)"
          if printf '%s\n' "$packages" | grep -qiE '^(leidenalg|igraph)([[:space:]]|$)'; then
            echo "FAIL: Leiden packages found in the base installation" >&2
            exit 1
          fi
          uv run --no-sync python -c "import sys; import omrs.core.community; assert 'leidenalg' not in sys.modules and 'igraph' not in sys.modules"
          echo "OK: base install uses Louvain without importing Leiden packages"

  # Optional Leiden must install and pass its focused graph contracts on
  # the lowest and the highest supported CPython versions. Both packages use
  # abi3 wheels, so one binary serves every version from the lowest up.
  community-leiden-extra:
    if: github.event_name != 'schedule'
    name: Leiden extra (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Install dependencies with community-leiden extra
        run: uv sync --frozen --extra community-leiden

      - name: Run community strategy contracts
        env:
          PDF_READER: pypdf
          EMBED_PROVIDER: local
          LOCAL_BACKEND: ollama
          EMBED_MODEL: nomic-embed-text
          OLLAMA_BASE_URL: http://localhost:11434
          METADATA_LLM_PROVIDER: local
        run: uv run --no-sync pytest tests/test_community_baseline.py tests/test_community_strategies.py tests/test_strategy_registration_inventory.py --tb=short -q

  # ── Torch-extra CI job (ADR-038, task 11.5) ───────────────────────────
  # The torch backend is opt-in. Without this dedicated job it would never
  # be exercised — the slow job has no schedule and suppresses failures
  # with || echo. This job installs the torch extra and runs the
  # torch-backend and cross-backend contract tests without suppression.
  torch-extra:
    if: github.event_name != 'schedule'
    name: Torch backend tests
    # The full-suite codecov job is the sole coverage upload. This narrow
    # optional-backend suite would otherwise replace the aggregate report.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to SHA for security — actions/checkout@v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        # Pinned to SHA for security — actions/setup-python@v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        # Pinned to SHA for security — astral-sh/setup-uv@v8.2.0
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Install dependencies with torch extra
        run: uv sync --extra torch

      - name: Run torch-backend and cross-backend contract tests
        env:
          PDF_READER: pypdf
          EMBED_PROVIDER: local
          LOCAL_BACKEND: ollama
          EMBED_MODEL: nomic-embed-text
          OLLAMA_BASE_URL: http://localhost:11434
          METADATA_LLM_PROVIDER: local
        run: uv run --no-sync pytest -m "slow" -k "torch or backend_contract" --tb=short -v

  # The web workspace frontend (web/) is a separate Node project. Its
  # build output ships in the wheel, so lint, type, unit-test and build
  # failures must block a PR like the Python gates do.
  frontend:
    if: github.event_name != 'schedule'
    name: Frontend (web)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      # Pinned to SHA for security — actions/checkout@v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node
        # Pinned to SHA for security — actions/setup-node@v7.0.0
        # Node 22 LTS satisfies the web/package.json engines field (>=22.12.0).
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  lint:
    if: github.event_name != 'schedule'
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to SHA for security — actions/checkout@v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        # Pinned to SHA for security — actions/setup-python@v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        # Pinned to SHA for security — astral-sh/setup-uv@v8.2.0
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Install dependencies
        env:
          UV_LINK_MODE: copy
        run: uv sync --frozen

      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      # The existing codebase has known Pyright debt. Surface diagnostics now without
      # turning that historical debt into a failing gate; make this blocking once paid down.
      - name: Pyright check (advisory)
        continue-on-error: true
        run: npx --yes pyright@1.1.412 src

  codecov:
    if: github.event_name != 'schedule'
    name: Coverage (Codecov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to SHA for security — actions/checkout@v7.0.0
      # fetch-depth 0: the exp-29 pinned-baseline tests read historical
      # commits via `git show <rev>:<path>`; a shallow checkout lacks them.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        # Pinned to SHA for security — actions/setup-python@v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        # Pinned to SHA for security — astral-sh/setup-uv@v8.2.0
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Install dependencies
        # community-leiden and anthropic included so patch coverage
        # exercises the optional Leiden strategies and the Anthropic Chat
        # provider (its tests skipif-guard without the extra). llamacpp and
        # openrouter stay as empty extras so the old command still works:
        # the OpenAI-like packages are now in the base install. chroma and hybrid join for the same reason: this is
        # the sole coverage upload, and the chroma adapter plus the
        # chroma-gated suites must count towards patch coverage of
        # vector-store diffs. web joins so the web transport tests count
        # towards coverage too. The base-only absence assertions live in
        # the floors job instead.
        run: uv sync --frozen --extra community-leiden --extra llamacpp --extra openrouter --extra anthropic --extra chroma --extra hybrid --extra web

      - name: Run tests with coverage
        env:
          PDF_READER: pypdf
          EMBED_PROVIDER: local
          LOCAL_BACKEND: ollama
          EMBED_MODEL: nomic-embed-text
          OLLAMA_BASE_URL: http://localhost:11434
          METADATA_LLM_PROVIDER: local
        # This job deliberately installs optional extras to maximise coverage;
        # the exact clean-base skip manifest is asserted in the base jobs.
        # pytest-cov combines the worker data under xdist, and --dist loadfile
        # comes from pyproject.toml (ADR-107).
        run: uv run --no-sync pytest -m "not slow" -n auto --maxprocesses=8 --ignore=tests/test_clean_base_tripwire.py --cov=omrs --cov-branch --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      # This job installs the chroma extra, so every Chroma-gated case must
      # run here. The report keeps every skip reason under xdist, including
      # module-level importorskip skips, so the check reads it and not the
      # console output.
      - name: Assert no test skipped for a missing chroma extra
        if: ${{ !cancelled() }}
        run: |
          report=junit.xml
          if [ ! -f "$report" ]; then
            echo "::error::$report is missing, so the chroma skip check cannot run"
            exit 1
          fi
          if grep -q 'chroma extra not installed' "$report"; then
            echo "::error::Tests skipped with the chroma-extra reason even though the extra is installed"
            grep -o 'message="[^"]*chroma extra not installed[^"]*"' "$report" | sort | uniq -c
            exit 1
          fi

      - name: Upload coverage to Codecov
        # Pinned to SHA for security — codecov/codecov-action@v7.0.0
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1
        with:
          files: ./coverage.xml
